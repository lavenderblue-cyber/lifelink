services:
  db:
    image: postgres:16
    container_name: lifelink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink_dev_password
      POSTGRES_DB: lifelink
    ports:
      - "5432:5432"
    volumes:
      - lifelink_postgres_data:/var/lib/postgresql/data

volumes:
  lifelink_postgres_data:
